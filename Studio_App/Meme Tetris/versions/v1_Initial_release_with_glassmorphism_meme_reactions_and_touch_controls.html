/* style.css */
:root {
    --bg-dark: #0f111a;
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);

    --text-muted: #94a3b8;
    --grid-color: rgba(255, 255, 255, 0.05);

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg-dark);

    display: flex;

    align-items: center;
}

.app-container {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 800px;

    flex-direction: column;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

}
.orb-1 {

    <script type="module" data-filename="main.js">
/* main.js */
import { COLS, ROWS, BLOCK_SIZE, COLORS, MEME_EMOJIS, SHAPES } from './constants.js';
import { TetrisEngine } from './engine.js';
import { updateMeme } from './memes.js';
import * as Audio from './audio.js';

// DOM Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nextCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('holdCanvas');
const holdCtx = holdCanvas.getContext('2d');

const scoreEl = document.getElementById('scoreVal');
const levelEl = document.getElementById('levelVal');
const linesEl = document.getElementById('linesVal');

const startOverlay = document.getElementById('startOverlay');
const gameOverOverlay = document.getElementById('gameOverOverlay');
const pauseOverlay = document.getElementById('pauseOverlay');
const finalScoreEl = document.getElementById('finalScore');
const godModeIndicator = document.getElementById('godModeIndicator');

// Game State
let engine;
let isPlaying = false;
let isPaused = false;
let lastTime = 0;
let dropCounter = 0;
let dropInterval = 1000;
let animationId;
let particles = [];

// God Mode
let isGodMode = false;
try {
    const debugOptions = JSON.parse(localStorage.getItem('gemini96-debugOptions') || '{}');
    isGodMode = debugOptions.flappyGodMode === true;
    if (isGodMode) {
        godModeIndicator.classList.remove('hidden');
    }
} catch (e) {
    console.warn("Could not read debug options", e);
}

function init() {
    engine = new TetrisEngine();
    
    // Check mobile mode
    if (document.body.classList.contains('mobile-mode') || window.innerWidth <= 600) {
        document.body.classList.add('mobile-mode');
    }

    setupEventListeners();
    drawEverything();
}

function start() {
    Audio.initAudio();
    engine.reset();
    isPlaying = true;
    isPaused = false;
    lastTime = performance.now();
    dropCounter = 0;
    particles = [];
    
    startOverlay.classList.add('hidden');
    gameOverOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    
    updateMeme('START');
    updateUI();
    cancelAnimationFrame(animationId);
    loop(performance.now());
}

function pause() {
    if (!isPlaying || engine.gameOver) return;
    isPaused = !isPaused;
    if (isPaused) {
        pauseOverlay.classList.remove('hidden');
        cancelAnimationFrame(animationId);
    } else {
        pauseOverlay.classList.add('hidden');
        lastTime = performance.now();
        loop(performance.now());
    }
}

function loop(time = 0) {
    if (!isPlaying || isPaused) return;

    const deltaTime = time - lastTime;
    lastTime = time;
    dropCounter += deltaTime;

    // Calculate speed based on level
    dropInterval = Math.max(100, 1000 - (engine.level - 1) * 100);

    if (dropCounter > dropInterval) {
        if (engine.softDrop()) {
            handlePieceLock();
        }
        dropCounter = 0;
    }

    updateParticles(deltaTime);
    drawEverything();

    if (!engine.gameOver) {
        animationId = requestAnimationFrame(loop);
    }
}

function handlePieceLock() {
    Audio.playDropSound();
    
    if (engine.gameOver) {
        if (isGodMode) {
            // God Mode: prevent game over, clear top rows
            engine.gameOver = false;
            for(let i=0; i<5; i++){
                engine.board.shift();
                engine.board.push(Array(COLS).fill(0));
            }
            updateMeme('DANGER');
        } else {
            handleGameOver();
            return;
        }
    }

    // Handle line clears and reactions
    if (engine.lastLinesCleared > 0) {
        createParticles();
        if (engine.lastLinesCleared === 4) {
            Audio.playTetrisSound();
            updateMeme('TETRIS');
        } else {
            Audio.playLineClearSound();
            if (engine.combo > 2) updateMeme('COMBO');
            else if (engine.lastLinesCleared === 3) updateMeme('TRIPLE');
            else if (engine.lastLinesCleared === 2) updateMeme('DOUBLE');
            else updateMeme('SINGLE');
        }
    } else {
        if (engine.isStackHigh()) {
            updateMeme('DANGER');
        } else {
            // updateMeme('DEFAULT');
        }
    }
    
    updateUI();
}

function handleGameOver() {
    isPlaying = false;
    Audio.playGameOverSound();
    updateMeme('GAMEOVER');
    finalScoreEl.innerText = engine.score;
    gameOverOverlay.classList.remove('hidden');
}

// Rendering
function drawBlock(ctx, x, y, type, size = BLOCK_SIZE, isGhost = false) {
    if (type === 0) return;
    
    const px = x * size;
    const py = y * size;

    if (isGhost) {
        ctx.fillStyle = COLORS[type];
        ctx.globalAlpha = 0.3;
        ctx.fillRect(px, py, size, size);
        ctx.globalAlpha = 1.0;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.strokeRect(px, py, size, size);
    } else {
        // Draw Glassy block
        ctx.fillStyle = COLORS[type];
        ctx.fillRect(px, py, size, size);
        
        // Highlight
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(px, py, size, size / 4);
        ctx.fillRect(px, py, size / 4, size);
        
        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(px, py + size * 0.75, size, size / 4);
        ctx.fillRect(px + size * 0.75, py, size / 4, size);
        
        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.strokeRect(px, py, size, size);

        // Emoji
        if (MEME_EMOJIS[type]) {
            ctx.font = `${size * 0.7}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // Slight drop shadow for emoji
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillText(MEME_EMOJIS[type], px + size/2 + 1, py + size/2 + 2);
            ctx.fillText(MEME_EMOJIS[type], px + size/2, py + size/2 + 1);
        }
    }
}

function drawMatrix(ctx, matrix, offsetX, offsetY, size = BLOCK_SIZE, isGhost = false) {
    matrix.forEach((row, y) => {
        row.forEach((value, x) => {
            if (value !== 0) {
                drawBlock(ctx, x + offsetX, y + offsetY, value, size, isGhost);
            }
        });
    });
}

function drawPreview(ctx, type) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    if (type === 0) return;
    
    const matrix = SHAPES[type];
    const size = 20;
    const offsetX = (ctx.canvas.width - matrix[0].length * size) / 2 / size;
    const offsetY = (ctx.canvas.height - matrix.length * size) / 2 / size;
    
    drawMatrix(ctx, matrix, offsetX, offsetY, size);
}

function drawEverything() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (engine) {
        // Draw Board
        drawMatrix(ctx, engine.board, 0, 0);

        // Draw Ghost
        const ghost = engine.getGhostPiece();
        if (ghost) {
            drawMatrix(ctx, ghost.matrix, ghost.x, ghost.y, BLOCK_SIZE, true);
        }

        // Draw Active
        if (engine.activePiece) {
            drawMatrix(ctx, engine.activePiece.matrix, engine.activePiece.x, engine.activePiece.y);
        }

        // Draw Particles
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        });

        // Draw Previews
        drawPreview(nextCtx, engine.nextPieceType);
        drawPreview(holdCtx, engine.holdPieceType);
    }
}

function updateUI() {
    scoreEl.innerText = engine.score;
    levelEl.innerText = engine.level;
    linesEl.innerText = engine.lines;
}

// Particles
function createParticles() {
    // Spawn particles along the bottom of the board or where lines cleared
    // Simplified: spawn at bottom
    for (let i = 0; i < 30; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: canvas.height - Math.random() * 50,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 1) * 5,
            life: 1,
            size: Math.random() * 4 + 2,
            color: Object.values(COLORS)[Math.floor(Math.random() * 7) + 1]
        });
    }
}

function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.2; // Gravity
        p.life -= 0.02 * (dt / 16);
        if (p.life <= 0) particles.splice(i, 1);
    }
}

// Input Handling
function handleInput(key) {
    if (!isPlaying || isPaused || engine.gameOver) return;

    switch(key) {
        case 'ArrowLeft':
        case 'a':
        case 'A':
            if (engine.move(-1, 0)) Audio.playMoveSound();
            break;
        case 'ArrowRight':
        case 'd':
        case 'D':
            if (engine.move(1, 0)) Audio.playMoveSound();
            break;
        case 'ArrowDown':
        case 's':
        case 'S':
            if (engine.move(0, 1)) {
                Audio.playMoveSound();
                scoreEl.innerText = ++engine.score; // Soft drop score
            }
            break;
        case 'ArrowUp':
        case 'w':
        case 'W':
            if (engine.rotate()) Audio.playRotateSound();
            break;
        case ' ':
            engine.hardDrop();
            handlePieceLock();
            break;
        case 'c':
        case 'C':
        case 'Shift':
            if (engine.holdPiece()) Audio.playRotateSound();
            break;
    }
    drawEverything();
}

function setupEventListeners() {
    document.addEventListener('keydown', (e) => {
        // Prevent default scrolling for game keys
        if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)){
            e.preventDefault();
        }
        
        if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
            pause();
            return;
        }
        
        Audio.initAudio(); // Initialize audio on first keypress
        handleInput(e.key);
    });

    document.getElementById('startBtn').addEventListener('click', start);
    document.getElementById('restartBtn').addEventListener('click', start);
    document.getElementById('resumeBtn').addEventListener('click', pause);
    
    document.getElementById('pauseBtn').addEventListener('click', () => {
        Audio.initAudio();
        pause();
    });

    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', () => {
        const isMuted = Audio.toggleMute();
        muteBtn.innerText = isMuted ? '🔇' : '🔊';
    });

    // Mobile Controls
    const mBtns = document.querySelectorAll('.m-btn');
    mBtns.forEach(btn => {
        // Use pointerdown for better touch response, fallback to click
        btn.addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Prevent double firing
            Audio.initAudio();
            const key = btn.getAttribute('data-key');
            if (key) handleInput(key);
        });
    });
}

// Run
window.addEventListener('load', init);
</script>

<script type="module" data-filename="audio.js">
/* audio.js */
// Web Audio API Synthesizer
let audioCtx;
let isMuted = false;

export function initAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
}

export function toggleMute() {
    isMuted = !isMuted;
    return isMuted;
}

function playTone(freq, type, duration, vol = 0.1) {
    if (isMuted || !audioCtx) return;
    
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }

    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    
    gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + duration);
}

export function playMoveSound() {
    playTone(300, 'sine', 0.1, 0.05);
}

export function playRotateSound() {
    playTone(400, 'triangle', 0.1, 0.05);
}

export function playDropSound() {
    playTone(150, 'square', 0.15, 0.1);
}

export function playLineClearSound() {
    if (isMuted || !audioCtx) return;
    // Chime
    playTone(600, 'sine', 0.3, 0.1);
    setTimeout(() => playTone(800, 'sine', 0.4, 0.1), 100);
}

export function playTetrisSound() {
    if (isMuted || !audioCtx) return;
    // Airhorn approximation
    const freqs = [400, 450, 400];
    freqs.forEach((f, i) => {
        setTimeout(() => {
            playTone(f, 'sawtooth', 0.3, 0.2);
            playTone(f * 1.5, 'square', 0.3, 0.1);
        }, i * 150);
    });
}

export function playGameOverSound() {
    if (isMuted || !audioCtx) return;
    // Vine boom approximation (low sweep)
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(100, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1);
    
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
    
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 1);
}
</script>

/* memes.js */
// Meme reaction logic
const reactionPanel = document.getElementById('memeReaction');

const MEME_STATES = {
    DEFAULT: { emoji: '🐕', text: 'Much Wow' },
    START: { emoji: '🎮', text: 'Let\'s Go!' },
    SINGLE: { emoji: '🐸', text: 'Not Bad' },
    DOUBLE: { emoji: '👯', text: 'Double!' },
    TRIPLE: { emoji: '🎯', text: 'Oh Baby!' },
    TETRIS: { emoji: '🗿', text: 'GIGACHAD' },
    COMBO: { emoji: '📈', text: 'STONKS' },
    DANGER: { emoji: '🐶🔥', text: 'This is fine' },
    GAMEOVER: { emoji: '🥿', text: 'EMOTIONAL DAMAGE' }
};

let currentReactionTimeout;

export function updateMeme(stateKey) {
    if (!reactionPanel || !MEME_STATES[stateKey]) return;
    
    const state = MEME_STATES[stateKey];
    reactionPanel.innerHTML = `
        <div class="meme-emoji">${state.emoji}</div>
        <div class="meme-text">${state.text}</div>
    `;

    // Add a little pop animation
    reactionPanel.style.transform = 'scale(1.2)';
    setTimeout(() => {
        reactionPanel.style.transform = 'scale(1)';
    }, 150);

    // Revert to default or danger after a while if it's an event
    if (['SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS', 'COMBO'].includes(stateKey)) {
        clearTimeout(currentReactionTimeout);
        currentReactionTimeout = setTimeout(() => {
            // Check if still in danger, else default handled by game engine
            reactionPanel.innerHTML = `
                <div class="meme-emoji">${MEME_STATES.DEFAULT.emoji}</div>
                <div class="meme-text">${MEME_STATES.DEFAULT.text}</div>
            `;
        }, 2000);
    }
}
</script>
<script type="module" data-filename="engine.js">
/* engine.js */
import { COLS, ROWS, SHAPES } from './constants.js';

export class TetrisEngine {
    constructor() {
        this.reset();
    }

    reset() {
        this.board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        this.score = 0;
        this.lines = 0;
        this.level = 1;
        this.gameOver = false;
        this.combo = 0;
        
        this.activePiece = null;
        this.nextPieceType = this.randomPiece();
        this.holdPieceType = 0;
        this.canHold = true;
        
        this.spawnPiece();
    }

    randomPiece() {
        return Math.floor(Math.random() * 7) + 1; // 1 to 7
    }

    spawnPiece() {
        const type = this.nextPieceType;
        this.nextPieceType = this.randomPiece();
        this.setPiece(type);
        this.canHold = true;

        if (this.checkCollision()) {
            this.gameOver = true;
        }
    }

    setPiece(type) {
        this.activePiece = {
            type: type,
            matrix: JSON.parse(JSON.stringify(SHAPES[type])), // Deep copy
            x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
            y: 0
        };
    }

    holdPiece() {
        if (!this.canHold) return false;
        
        const currentType = this.activePiece.type;
        if (this.holdPieceType === 0) {
            this.holdPieceType = currentType;
            this.spawnPiece();
        } else {
            const temp = this.holdPieceType;
            this.holdPieceType = currentType;
            this.setPiece(temp);
        }
        this.canHold = false;
        // Reset position to top
        this.activePiece.y = 0;
        return true;
    }

    move(dx, dy) {
        if (!this.activePiece) return false;
        
        this.activePiece.x += dx;
        this.activePiece.y += dy;
        
        if (this.checkCollision()) {
            this.activePiece.x -= dx;
            this.activePiece.y -= dy;
            return false;
        }
        return true;
    }

    rotate() {
        if (!this.activePiece) return false;

        const originalMatrix = this.activePiece.matrix;
        const matrix = originalMatrix;
        const N = matrix.length;
        
        // Transpose
        let newMatrix = Array.from({ length: N }, () => Array(N).fill(0));
        for (let y = 0; y < N; ++y) {
            for (let x = 0; x < N; ++x) {
                newMatrix[x][N - 1 - y] = matrix[y][x];
            }
        }

        this.activePiece.matrix = newMatrix;

        // Basic Wall Kick
        let offset = 1;
        let origX = this.activePiece.x;
        
        if (this.checkCollision()) {
            this.activePiece.x += offset; // Try right
            if (this.checkCollision()) {
                this.activePiece.x = origX - offset; // Try left
                if (this.checkCollision()) {
                    // Revert
                    this.activePiece.x = origX;
                    this.activePiece.matrix = originalMatrix;
                    return false;
                }
            }
        }
        return true;
    }

    hardDrop() {
        let distance = 0;
        while (this.move(0, 1)) {
            distance++;
        }
        this.lockPiece();
        return distance;
    }

    softDrop() {
        if (!this.move(0, 1)) {
            this.lockPiece();
            return true; // Locked
        }
        return false;
    }

    lockPiece() {
        const { matrix, x, y } = this.activePiece;
        
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] !== 0) {
                    if (y + r < 0) continue; // Should not happen with current spawn
                    this.board[y + r][x + c] = matrix[r][c];
                }
            }
        }
        
        this.clearLines();
        if (!this.gameOver) {
             this.spawnPiece();
        }
    }

    clearLines() {
        let linesCleared = 0;
        
        outer: for (let r = ROWS - 1; r >= 0; r--) {
            for (let c = 0; c < COLS; c++) {
                if (this.board[r][c] === 0) {
                    continue outer;
                }
            }
            
            // Remove line and shift down
            this.board.splice(r, 1);
            this.board.unshift(Array(COLS).fill(0));
            linesCleared++;
            r++; // Check same row index again after shift
        }
        
        if (linesCleared > 0) {
            this.lines += linesCleared;
            this.level = Math.floor(this.lines / 10) + 1;
            this.combo++;
            
            // Scoring
            const lineScores = [0, 100, 300, 500, 800];
            this.score += lineScores[linesCleared] * this.level;
            if (this.combo > 1) {
                this.score += 50 * this.combo * this.level;
            }
        } else {
            this.combo = 0;
        }

        this.lastLinesCleared = linesCleared;
    }

    checkCollision() {
        const { matrix, x, y } = this.activePiece;
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] !== 0) {
                    let newX = x + c;
                    let newY = y + r;
                    
                    if (newX < 0 || newX >= COLS || newY >= ROWS) {
                        return true; // Bounds
                    }
                    if (newY >= 0 && this.board[newY][newX] !== 0) {
                        return true; // Blocked
                    }
                }
            }
        }
        return false;
    }

    getGhostPiece() {
        if (!this.activePiece) return null;
        
        const ghost = {
            ...this.activePiece,
            y: this.activePiece.y
        };
        
        while (true) {
            ghost.y++;
            // Manually check collision for ghost to avoid altering engine state
            let collision = false;
            for (let r = 0; r < ghost.matrix.length; r++) {
                for (let c = 0; c < ghost.matrix[r].length; c++) {
                    if (ghost.matrix[r][c] !== 0) {
                        let nx = ghost.x + c;
                        let ny = ghost.y + r;
                        if (nx < 0 || nx >= COLS || ny >= ROWS || (ny >= 0 && this.board[ny][nx] !== 0)) {
                            collision = true;
                            break;
                        }
                    }
                }
                if (collision) break;
            }
            if (collision) {
                ghost.y--;
                break;
            }
        }
        return ghost;
    }
    
    isStackHigh() {
        // Check if any blocks in top 5 rows
        for(let r=0; r<5; r++){
            for(let c=0; c<COLS; c++){
                if(this.board[r][c] !== 0) return true;
            }
        }
        return false;
    }
}
