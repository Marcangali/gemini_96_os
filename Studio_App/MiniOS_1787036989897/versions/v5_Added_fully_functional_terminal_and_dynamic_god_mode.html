    <title>MiniOS</title>
    <style data-filename="style.css">
/* style.css */
:root {
    --os-bg: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop');
    --sys-bg-blur: rgba(255, 255, 255, 0.7);
    --sys-bg-solid: #ffffff;
    --sys-text: #1a1a1a;
    --sys-text-muted: #666666;
    --sys-accent: #0067c0;
    --sys-accent-hover: #005a9e;
    --sys-border: rgba(0, 0, 0, 0.1);
    --sys-shadow: 0 4px 24px rgba(0,0,0,0.1);
    --sys-radius: 12px;
    --taskbar-height: 48px;
    --app-bg: #f9f9f9;
}

.dark-theme {
    --sys-bg-blur: rgba(30, 30, 30, 0.75);
    --sys-bg-solid: #202020;
    --sys-text: #ffffff;
    --sys-text-muted: #aaaaaa;
    --sys-border: rgba(255, 255, 255, 0.1);
    --sys-shadow: 0 8px 32px rgba(0,0,0,0.4);
    --app-bg: #2d2d2d;
    --sys-accent: #4cc2ff;
    --sys-accent-hover: #38a4d9;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    user-select: none;
}

body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
}

#root {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.os-container {
    position: relative;
    width: 100%;
    height: 100%;
    background-image: var(--os-bg);
    background-size: cover;
    background-position: center;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.desktop {
    flex: 1;
    position: relative;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
    grid-auto-rows: 90px;
    gap: 8px;
    align-content: start;
    z-index: 10;
}

.desktop-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s;
    color: white;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
}

.desktop-icon:hover {
    background: rgba(255, 255, 255, 0.2);
}

.desktop-icon:active {
    background: rgba(255, 255, 255, 0.3);
}

.icon-wrapper {
    width: 48px;
    height: 48px;
    background: var(--sys-bg-solid);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--sys-text);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.desktop-icon span {
    font-size: 12px;
    text-align: center;
    font-weight: 500;
}

.taskbar {
    height: var(--taskbar-height);
    background: var(--sys-bg-blur);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--sys-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 100;
}

.taskbar-center {
    display: flex;
    gap: 8px;
    flex: 1;
    justify-content: center;
}

.taskbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--sys-text);
    font-size: 12px;
}

.start-button {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: var(--sys-accent);
}

.start-button:hover, .taskbar-icon:hover {
    background: rgba(128, 128, 128, 0.15);
}

.taskbar-icon {
    width: 36px;
    height: 36px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--sys-text);
    position: relative;
}

.taskbar-icon.active::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px;
    height: 3px;
    background: var(--sys-accent);
    border-radius: 2px;
}

.sys-tray {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
}

.sys-tray:hover {
    background: rgba(128, 128, 128, 0.15);
}

.start-menu {
    position: absolute;
    bottom: calc(var(--taskbar-height) + 12px);
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 340px;
    height: 400px;
    background: var(--sys-bg-blur);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--sys-border);
    border-radius: var(--sys-radius);
    box-shadow: var(--sys-shadow);
    z-index: 90;
    display: flex;
    flex-direction: column;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    transform: translate(-50%, 10px);
}

.start-menu.open {
    opacity: 1;
    pointer-events: auto;
    transform: translate(-50%, 0);
}

.start-search {
    width: 100%;
    padding: 10px 16px;
    border-radius: 20px;
    border: 1px solid var(--sys-border);
    background: rgba(255, 255, 255, 0.5);
    color: var(--sys-text);
    outline: none;
    margin-bottom: 16px;
}

.dark-theme .start-search { background: rgba(0,0,0,0.2); }

.start-apps-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    overflow-y: auto;
}

.start-app-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--sys-text);
}
.start-app-item:hover { background: rgba(128, 128, 128, 0.1); }
.start-app-item .icon { font-size: 24px; margin-bottom: 4px; }
.start-app-item span { font-size: 11px; text-align: center; }

.window-container {
    position: absolute;
    background: var(--app-bg);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: windowOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.window-resize-handle {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
    z-index: 100;
}

.window-resize-handle::after {
    content: '';
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 8px;
    height: 8px;
    border-right: 2px solid var(--sys-text-muted);
    border-bottom: 2px solid var(--sys-text-muted);
    opacity: 0.5;
}

@keyframes windowOpen {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}

.window-header {
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--sys-bg-solid);
    border-bottom: 1px solid var(--sys-border);
    color: var(--sys-text);
    font-weight: 600;
    font-size: 14px;
}

.window-title { display: flex; align-items: center; gap: 8px; pointer-events: none; }

.window-controls { display: flex; gap: 4px; }
.window-btn {
    width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sys-text);
}
.window-btn:hover { background: rgba(128,128,128,0.2); }
.window-btn.close:hover { background: #e81123; color: white; }

.window-content {
    flex: 1;
    overflow-y: auto;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* App: Calculator */
.calc-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 2px;
    flex: 1;
    padding: 2px;
    background: var(--sys-border);
}
.calc-display {
    grid-column: 1 / -1;
    background: var(--app-bg);
    color: var(--sys-text);
    font-size: 32px;
    text-align: right;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    word-break: break-all;
}
.calc-btn {
    background: var(--sys-bg-solid);
    border: none;
    color: var(--sys-text);
    font-size: 18px;
    cursor: pointer;
    transition: background 0.1s;
}
.calc-btn:active { background: var(--sys-border); }
.calc-btn.accent { background: var(--sys-accent); color: white; }
.calc-btn.accent:active { background: var(--sys-accent-hover); }

/* App: Notes */
.notes-textarea {
    width: 100%;
    flex: 1;
    border: none;
    resize: none;
    padding: 16px;
    font-size: 16px;
    background: var(--app-bg);
    color: var(--sys-text);
    outline: none;
}

/* App: Settings */
.settings-container { padding: 20px; color: var(--sys-text); }
.settings-section { margin-bottom: 24px; }
.settings-section h3 { margin-bottom: 12px; font-size: 14px; color: var(--sys-text-muted); text-transform: uppercase; }
.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--sys-bg-solid); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--sys-border); }

/* App: Terminal */
.terminal-container { background: #0c0c0c; color: #00ff00; font-family: monospace; padding: 10px; flex: 1; overflow-y: auto; }
.terminal-line { margin-bottom: 4px; font-size: 13px;}
.terminal-cursor { display: inline-block; width: 8px; height: 14px; background: #00ff00; animation: blink 1s step-end infinite; vertical-align: middle;}
@keyframes blink { 50% { opacity: 0; } }

.god-mode-indicator { color: #ff3333; font-weight: bold; font-size: 10px; border: 1px solid #ff3333; padding: 2px 4px; border-radius: 4px; margin-right: 8px; }

/* Utilities */
.text-xs { font-size: 10px; }
.font-bold { font-weight: bold; }

/* Mobile Optimizations */
body.mobile-mode .desktop {
    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
    grid-auto-rows: 80px;
}
body.mobile-mode .window-container {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100% - var(--taskbar-height)) !important;
    border-radius: 0 !important;
}
body.mobile-mode .window-resize-handle {
    display: none !important;
}
</style>

t);\n}\n.start-app-item:hover { background: rgba(128, 128, 128, 0.1); }\n.start-app-item .icon { font-size: 24px; margin-bottom: 4px; }\n.start-app-item span { font-size: 11px; text-align: center; }\n\n.window-container {\n    position: absolute;\n    background: var(--app-bg);\n    display: flex;\n    flex-direction: column;\n    overflow: hidden;\n    animation: windowOpen 0.2s cubic-bezier(0.16, 1, 0.3, 1);\n}\n\n.window-resize-handle {\n    position: absolute;\n    bottom: 0;\n    right: 0;\n    width: 16px;\n    height: 16px;\n    cursor: nwse-resize;\n    z-index: 100;\n}\n\n.window-resize-handle::after {\n    content: '';\n    position: absolute;\n    bottom: 4px;\n    right: 4px;\n    width: 8px;\n    height: 8px;\n    border-right: 2px solid var(--sys-text-muted);\n    border-bottom: 2px solid var(--sys-text-muted);\n    opacity: 0.5;\n}\n\n@keyframes windowOpen {\n    from { opacity: 0; transform: scale(0.95); }\n    to { opacity: 1; transform: scale(1); }\n}\n\n.window-header {\n    height: 40px;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 0 12px;\n    background: var(--sys-bg-solid);\n    border-bottom: 1px solid var(--sys-border);\n    color: var(--sys-text);\n    font-weight: 600;\n    font-size: 14px;\n}\n\n.window-title { display: flex; align-items: center; gap: 8px; pointer-events: none; }\n\n.window-controls { display: flex; gap: 4px; }\n.window-btn {\n    width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--sys-text);\n}\n.window-btn:hover { background: rgba(128,128,128,0.2); }\n.window-btn.close:hover { background: #e81123; color: white; }\n\n.window-content {\n    flex: 1;\n    overflow-y: auto;\n    position: relative;\n    display: flex;\n    flex-direction: column;\n}\n\n/* App: Calculator */\n.calc-grid {\n    display: grid;\n    grid-template-columns: repeat(4, 1fr);\n    gap: 2px;\n    flex: 1;\n    padding: 2px;\n    background: var(--sys-border);\n}\n.calc-display {\n    grid-column: 1 / -1;\n    background: var(--app-bg);\n    color: var(--sys-text);\n    font-size: 32px;\n    text-align: right;\n    padding: 20px 16px;\n    display: flex;\n    flex-direction: column;\n    justify-content: flex-end;\n    word-break: break-all;\n}\n.calc-btn {\n    background: var(--sys-bg-solid);\n    border: none;\n    color: var(--sys-text);\n    font-size: 18px;\n    cursor: pointer;\n    transition: background 0.1s;\n}\n.calc-btn:active { background: var(--sys-border); }\n.calc-btn.accent { background: var(--sys-accent); color: white; }\n.calc-btn.accent:active { background: var(--sys-accent-hover); }\n\n/* App: Notes */\n.notes-textarea {\n    width: 100%;\n    flex: 1;\n    border: none;\n    resize: none;\n    padding: 16px;\n    font-size: 16px;\n    background: var(--app-bg);\n    color: var(--sys-text);\n    outline: none;\n}\n\n/* App: Settings */\n.settings-container { padding: 20px; color: var(--sys-text); }\n.settings-section { margin-bottom: 24px; }\n.settings-section h3 { margin-bottom: 12px; font-size: 14px; color: var(--sys-text-muted); text-transform: uppercase; }\n.setting-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--sys-bg-solid); border-radius: 8px; margin-bottom: 8px; border: 1px solid var(--sys-border); }\n\n/* App: Terminal */\n.terminal-container { background: #0c0c0c; color: #00ff00; font-family: monospace; padding: 10px; flex: 1; overflow-y: auto; }\n.terminal-line { margin-bottom: 4px; font-size: 13px;}\n.terminal-cursor { display: inline-block; width: 8px; height: 14px; background: #00ff00; animation: blink 1s step-end infinite; vertical-align: middle;}\n@keyframes blink { 50% { opacity: 0; } }\n\n.god-mode-indicator { color: #ff3333; font-weight: bold; font-size: 10px; border: 1px solid #ff3333; padding: 2px 4px; border-radius: 4px; margin-right: 8px; }\n\n/* Utilities */\n.text-xs { font-size: 10px; }\n.font-bold { font-weight: bold; }\n\n/* Mobile Optimizations */\nbody.mobile-mode .desktop {\n    grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));\n    grid-auto-rows: 80px;\n}\nbody.mobile-mode .window-container {\n    top: 0 !important;\n    left: 0 !important;\n    width: 100% !important;\n    height: calc(100% - var(--taskbar-height)) !important;\n    border-radius: 0 !important;\n}\nbody.mobile-mode .window-resize-handle {\n    display: none !important;\n}","types.ts":"export interface AppDefinition {\n    id: string;\n    name: string;\n    icon: any; // Lucide icon component\n    component: React.FC<{ onClose: () => void }>;\n    isGodModeOnly?: boolean;\n}\n\nexport interface OsState {\n    activeAppId: string | null;\n    openAppIds: string[];\n    isStartMenuOpen: boolean;\n}","utils/audio.ts":"let audioCtx: AudioContext | null = null;\n\nconst getAudioContext = () => {\n    if (!audioCtx) {\n        audioCtx = new (window.AudioContext || (window as any).webkitAudioContext)();\n    }\n    if (audioCtx.state === 'suspended') {\n        audioCtx.resume();\n    }\n    return audioCtx;\n};\n\nexport const playClickSound = () => {\n    try {\n        const ctx = getAudioContext();\n        const osc = ctx.createOscillator();\n        const gainNode = ctx.createGain();\n\n        osc.type = 'sine';\n        osc.frequency.setValueAtTime(800, ctx.currentTime);\n        osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.05);\n\n        gainNode.gain.setValueAtTime(0.1, ctx.currentTime);\n        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);\n\n        osc.connect(gainNode);\n        gainNode.connect(ctx.destination);\n\n        osc.start();\n        osc.stop(ctx.currentTime + 0.05);\n    } catch (e) {\n        console.error(\"Audio error\", e);\n    }\n};\n\nexport const playStartupSound = () => {\n    try {\n        const ctx = getAudioContext();\n        const osc1 = ctx.createOscillator();\n        const osc2 = ctx.createOscillator();\n        const gainNode = ctx.createGain();\n\n        osc1.type = 'sine';\n        osc2.type = 'triangle';\n        \n        osc1.frequency.setValueAtTime(523.25, ctx.currentTime);\n        osc2.frequency.setValueAtTime(659.25, ctx.currentTime);\n\n        gainNode.gain.setValueAtTime(0, ctx.currentTime);\n        gainNode.gain.linearRampToValueAtTime(0.15, ctx.currentTime + 0.1);\n        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);\n\n        osc1.connect(gainNode);\n        osc2.connect(gainNode);\n        gainNode.connect(ctx.destination);\n\n        osc1.start();\n        osc2.start();\n        osc1.stop(ctx.currentTime + 1.5);\n        osc2.stop(ctx.currentTime + 1.5);\n    } catch (e) {\n        console.error(\"Audio error\", e);\n    }\n};\n\nexport const playErrorSound = () => {\n    try {\n        const ctx = getAudioContext();\n        const osc = ctx.createOscillator();\n        const gainNode = ctx.createGain();\n\n        osc.type = 'sawtooth';\n        osc.frequency.setValueAtTime(150, ctx.currentTime);\n        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.2);\n\n        gainNode.gain.setValueAtTime(0.2, ctx.currentTime);\n        gainNode.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);\n\n        osc.connect(gainNode);\n        gainNode.connect(ctx.destination);\n\n        osc.start();\n        osc.stop(ctx.currentTime + 0.2);\n    } catch (e) {\n        console.error(\"Audio error\", e);\n    }\n}","utils/godMode.ts":"export const checkGodMode = (): boolean => {\n    try {\n        const debugOptions = JSON.parse(localStorage.getItem('gemini96-debugOptions') || '{}');\n        return debugOptions.flappyGodMode === true || debugOptions.godMode === true;\n    } catch (e) {\n        return false;\n    }\n};\n\nexport const setGodMode = (enabled: boolean): void => {\n    try {\n        const debugOptions = JSON.parse(localStorage.getItem('gemini96-debugOptions') || '{}');\n        debugOptions.godMode = enabled;\n        localStorage.setItem('gemini96-debugOptions', JSON.stringify(debugOptions));\n        \n        // Dispatch an event so the OS can update its UI immediately without a reload\n        window.dispatchEvent(new Event('godModeChanged'));\n    } catch (e) {\n        console.error(\"Failed to set God Mode\", e);\n    }\n};","components/apps/Calculator.tsx":"import React, { useState } from 'react';\nimport { playClickSound, playErrorSound } from '../../utils/audio';\n\nexport const Calculator: React.FC<{ onClose: () => void }> = () => {\n    const [display, setDisplay] = useState('0');\n    const [equation, setEquation] = useState('');\n\n    const handlePress = (val: string) => {\n        playClickSound();\n        if (val === 'C') {\n            setDisplay('0');\n            setEquation('');\n        } else if (val === '=') {\n            try {\n                const sanitized = equation + display;\n                if(/^[0-9+\\-*/. ]+$/.test(sanitized)) {\n                    // eslint-disable-next-line no-new-func\n                    const result = new Function('return ' + sanitized)();\n                    setDisplay(String(result));\n                    setEquation('');\n                } else {\n                    throw new Error(\"Invalid\");\n                }\n            } catch (e) {\n                setDisplay('Error');\n                setEquation('');\n                playErrorSound();\n            }\n        } else if (['+', '-', '*', '/'].includes(val)) {\n            setEquation(display + val);\n            setDisplay('0');\n        } else {\n            setDisplay(display === '0' ? val : display + val);\n        }\n    };\n\n    const buttons = [\n        'C', '(', ')', '/',\n        '7', '8', '9', '*',\n        '4', '5', '6', '-',\n        '1', '2', '3', '+',\n        '0', '.', '=', ''\n    ];\n\n    return (\n        <div className=\"calc-grid\">\n            <div className=\"calc-display\">\n                <div style={{fontSize: '14px', color: 'var(--sys-text-muted)', minHeight: '20px'}}>{equation}</div>\n                <div>{display}</div>\n            </div>\n            {buttons.map((btn, i) => (\n                btn ? (\n                    <button \n                        key={i} \n                        className={`calc-btn ${btn === '=' ? 'accent' : ''}`}\n                        onClick={() => handlePress(btn)}\n                    >\n                        {btn}\n                    </button>\n                ) : <div key={i} />\n            ))}\n        </div>\n    );\n};","components/apps/Notes.tsx":"import React, { useState, useEffect } from 'react';\n\nexport const Notes: React.FC<{ onClose: () => void }> = () => {\n    const [text, setText] = useState('');\n\n    useEffect(() => {\n        const saved = localStorage.getItem('minios-notes');\n        if (saved) setText(saved);\n    }, []);\n\n    const handleChange = (e: React.ChangeEvent<HTMLTextAreaElement>) => {\n        setText(e.target.value);\n        localStorage.setItem('minios-notes', e.target.value);\n    };\n\n    return (\n        <textarea \n            className=\"notes-textarea\" \n            value={text}\n            onChange={handleChange}\n            placeholder=\"Type your notes here... (Auto-saved)\"\n            autoFocus\n        />\n    );\n};","components/apps/Settings.tsx":"import React, { useState, useEffect } from 'react';\nimport { playClickSound } from '../../utils/audio';\n\nexport const Settings: React.FC<{ onClose: () => void }> = () => {\n    const [isDark, setIsDark] = useState(false);\n\n    useEffect(() => {\n        setIsDark(document.documentElement.classList.contains('dark-theme'));\n    }, []);\n\n    const toggleTheme = () => {\n        playClickSound();\n        const root = document.documentElement;\n        if (isDark) {\n            root.classList.remove('dark-theme');\n        } else {\n            root.classList.add('dark-theme');\n        }\n        setIsDark(!isDark);\n    };\n\n    return (\n        <div className=\"settings-container\">\n            <div className=\"settings-section\">\n                <h3>Personalization</h3>\n                <div className=\"setting-item\">\n                    <span>Dark Mode</span>\n                    <button onClick={toggleTheme} style={{\n                        padding: '6px 12px', borderRadius: '4px', border: '1px solid var(--sys-border)', background: 'var(--sys-bg-blur)', color: 'var(--sys-text)', cursor: 'pointer'\n                    }}>\n                        {isDark ? 'Turn Off' : 'Turn On'}\n                    </button>\n                </div>\n            </div>\n            \n            <div className=\"settings-section\">\n                <h3>System</h3>\n                <div className=\"setting-item\" style={{flexDirection: 'column', alignItems: 'flex-start', gap: '8px'}}>\n                    <div style={{fontWeight: 'bold'}}>MiniOS v1.0</div>\n                    <div style={{fontSize: '12px', color: 'var(--sys-text-muted)'}}>Compact Web OS Environment</div>\n                    <div style={{fontSize: '12px', color: 'var(--sys-text-muted)'}}>Memory: 4.00 GB (Emulated)</div>\n                </div>\n            </div>\n        </div>\n    );\n};","components/apps/Terminal.tsx":"import React, { useState, useEffect, useRef } from 'react';\nimport { setGodMode } from '../../utils/godMode';\n\nexport const Terminal: React.FC<{ onClose: () => void }> = ({ onClose }) => {\n    const [lines, setLines] = useState<string[]>([]);\n    const [input, setInput] = useState('');\n    const [isBooting, setIsBooting] = useState(true);\n    const [history, setHistory] = useState<string[]>([]);\n    const [historyIdx, setHistoryIdx] = useState(-1);\n    \n    const bottomRef = useRef<HTMLDivElement>(null);\n    const inputRef = useRef<HTMLInputElement>(null);\n\n    useEffect(() => {\n        const bootSequence = [\n            \"Initializing kernel... OK\",\n            \"Mounting virtual file systems... OK\",\n            \"Loading God Mode modules... OVERRIDE GRANTED\",\n            \"Bypassing security protocols... DONE\",\n            \" \",\n            \"ROOT ACCESS GRANTED.\",\n            \"Type 'help' for a list of available commands.\"\n        ];\n\n        let i = 0;\n        const interval = setInterval(() => {\n            if (i < bootSequence.length) {\n                setLines(prev => [...prev, bootSequence[i]]);\n                i++;\n            } else {\n                clearInterval(interval);\n                setIsBooting(false);\n            }\n        }, 150);\n\n        return () => clearInterval(interval);\n    }, []);\n\n    useEffect(() => {\n        if (bottomRef.current) {\n            bottomRef.current.scrollIntoView({ behavior: \"smooth\" });\n        }\n    }, [lines, isBooting, input]);\n\n    const handleContainerClick = () => {\n        if (!isBooting && inputRef.current) {\n            inputRef.current.focus();\n        }\n    };\n\n    const handleCommand = (cmd: string) => {\n        const trimmedCmd = cmd.trim();\n        \n        if (trimmedCmd) {\n            setHistory(prev => [...prev, trimmedCmd]);\n            setHistoryIdx(-1);\n        }\n\n        setLines(prev => [...prev, `root@minios:~# ${cmd}`]);\n\n        if (!trimmedCmd) return;\n\n        const args = trimmedCmd.split(' ').filter(Boolean);\n        const baseCmd = args[0]?.toLowerCase();\n\n        let output: string | string[] = '';\n        \n        switch (baseCmd) {\n            case 'help':\n                output = [\n                    \"Available commands:\",\n                    \"  help     - Show this message\",\n                    \"  clear    - Clear the terminal screen\",\n                    \"  echo     - Print text to the terminal\",\n                    \"  date     - Show current system date and time\",\n                    \"  whoami   - Print current user\",\n                    \"  uname    - Print system information\",\n                    \"  ls       - List directory contents\",\n                    \"  cat      - Concatenate and print files\",\n                    \"  ping     - Send ICMP ECHO_REQUEST to network hosts\",\n                    \"  godmode  - Toggle system God Mode (godmode on/off)\",\n                    \"  exit     - Close the terminal\"\n                ];\n                break;\n            case 'clear':\n                setLines([]);\n                return;\n            case 'echo':\n                output = args.slice(1).join(' ');\n                break;\n            case 'date':\n                output = new Date().toString();\n                break;\n            case 'whoami':\n                output = \"root\";\n                break;\n            case 'uname':\n                output = \"MiniOS v1.0 (God Mode Kernel) web-x86_64\";\n                break;\n            case 'ls':\n                output = \"bin  boot  dev  etc  home  lib  opt  root  run  sbin  sys  tmp  usr  var  secret.txt\";\n                break;\n            case 'cat':\n                if (args[1] === 'secret.txt') {\n                    output = \"SYSTEM OVERRIDE CODE: 0xDEADBEEF\\nProperty of MiniOS Admin.\";\n                } else if (!args[1]) {\n                    output = \"cat: missing operand\";\n                } else {\n                    output = `cat: ${args[1]}: No such file or directory`;\n                }\n                break;\n            case 'ping':\n                if (!args[1]) {\n                    output = \"Usage: ping <destination>\";\n                } else {\n                    output = [\n                        `PING ${args[1]} (192.168.1.1) 56(84) bytes of data.`,\n                        `64 bytes from ${args[1]}: icmp_seq=1 ttl=64 time=14.2 ms`,\n                        `64 bytes from ${args[1]}: icmp_seq=2 ttl=64 time=16.8 ms`,\n                        `64 bytes from ${args[1]}: icmp_seq=3 ttl=64 time=12.1 ms`,\n                        `--- ${args[1]} ping statistics ---`,\n                        `3 packets transmitted, 3 received, 0% packet loss`\n                    ];\n                }\n                break;\n            case 'godmode':\n                if (args[1] === 'on' || args[1] === 'enable') {\n                    setGodMode(true);\n                    output = \"SYSTEM OVERRIDE: God Mode ENABLED.\";\n                } else if (args[1] === 'off' || args[1] === 'disable') {\n                    setGodMode(false);\n                    output = \"SYSTEM OVERRIDE: God Mode DISABLED.\";\n                } else {\n                    output = \"Usage: godmode [on|off]\";\n                }\n                break;\n            case 'exit':\n                onClose();\n                return;\n            default:\n                output = `bash: ${baseCmd}: command not found`;\n        }\n\n        if (output) {\n            if (Array.isArray(output)) {\n                setLines(prev => [...prev, ...output]);\n            } else {\n                setLines(prev => [...prev, ...output.split('\\n')]);\n            }\n        }\n    };\n\n    const handleKeyDown = (e: React.KeyboardEvent<HTMLInputElement>) => {\n        if (e.key === 'Enter') {\n            handleCommand(input);\n            setInput('');\n        } else if (e.key === 'ArrowUp') {\n            e.preventDefault();\n            if (history.length > 0) {\n                const nextIdx = historyIdx + 1 < history.length ? historyIdx + 1 : historyIdx;\n                setHistoryIdx(nextIdx);\n                setInput(history[history.length - 1 - nextIdx]);\n            }\n        } else if (e.key === 'ArrowDown') {\n            e.preventDefault();\n            if (historyIdx > 0) {\n                const nextIdx = historyIdx - 1;\n                setHistoryIdx(nextIdx);\n                setInput(history[history.length - 1 - nextIdx]);\n            } else if (historyIdx === 0) {\n                setHistoryIdx(-1);\n                setInput('');\n            }\n        }\n    };\n\n    return (\n        <div className=\"terminal-container\" onClick={handleContainerClick}>\n            {lines.map((line, idx) => (\n                <div key={idx} className=\"terminal-line\" style={{ whiteSpace: 'pre-wrap' }}>{line}</div>\n            ))}\n            {!isBooting && (\n                <div style={{ display: 'flex', alignItems: 'center' }}>\n                    <span className=\"terminal-line\" style={{ marginRight: '8px', marginBottom: 0 }}>root@minios:~#</span>\n                    <input \n                        ref={inputRef}\n                        type=\"text\" \n                        value={input}\n                        onChange={(e) => setInput(e.target.value)}\n                        onKeyDown={handleKeyDown}\n                        autoFocus\n                        autoComplete=\"off\"\n                        spellCheck=\"false\"\n                        style={{\n                            background: 'transparent',\n                            border: 'none',\n                            color: '#00ff00',\n                            fontFamily: 'monospace',\n                            fontSize: '13px',\n                            flex: 1,\n                            outline: 'none',\n                            padding: 0,\n                            margin: 0\n                        }}\n                    />\n                </div>\n            )}\n            {isBooting && <span className=\"terminal-cursor\" />}\n            <div ref={bottomRef} style={{ height: '1px' }} />\n        </div>\n    );\n};","components/Window.tsx":"import React, { useState, useRef } from 'react';\nimport { X, Minus, Square, Minimize2 } from 'lucide-react';\nimport { AppDefinition } from '../types';\n\ninterface WindowProps {\n    app: AppDefinition;\n    isActive: boolean;\n    onFocus: () => void;\n    onClose: () => void;\n}\n\nexport const Window: React.FC<WindowProps> = ({ app, isActive, onFocus, onClose }) => {\n    const [isMaximized, setIsMaximized] = useState(false);\n    \n    // Initial random position to offset new windows\n    const pos = useRef({ x: 20 + Math.random() * 40, y: 20 + Math.random() * 40 });\n    const size = useRef({ w: 320, h: 420 });\n    \n    const windowRef = useRef<HTMLDivElement>(null);\n\n    const isDragging = useRef(false);\n    const isResizing = useRef(false);\n    const dragOffset = useRef({ x: 0, y: 0 });\n\n    const handlePointerDownHeader = (e: React.PointerEvent) => {\n        onFocus();\n        if (isMaximized) return;\n        \n        isDragging.current = true;\n        dragOffset.current = {\n            x: e.clientX - pos.current.x,\n            y: e.clientY - pos.current.y\n        };\n        (e.target as HTMLElement).setPointerCapture(e.pointerId);\n    };\n\n    const handlePointerMoveHeader = (e: React.PointerEvent) => {\n        if (isDragging.current && windowRef.current) {\n            pos.current = {\n                x: e.clientX - dragOffset.current.x,\n                y: e.clientY - dragOffset.current.y\n            };\n            windowRef.current.style.left = `${pos.current.x}px`;\n            windowRef.current.style.top = `${pos.current.y}px`;\n        }\n    };\n\n    const handlePointerUpHeader = (e: React.PointerEvent) => {\n        if (isDragging.current) {\n            isDragging.current = false;\n            (e.target as HTMLElement).releasePointerCapture(e.pointerId);\n        }\n    };\n\n    const handlePointerDownResize = (e: React.PointerEvent) => {\n        onFocus();\n        if (isMaximized) return;\n        isResizing.current = true;\n        dragOffset.current = {\n            x: e.clientX - size.current.w,\n            y: e.clientY - size.current.h\n        };\n        (e.target as HTMLElement).setPointerCapture(e.pointerId);\n        e.stopPropagation();\n    };\n\n    const handlePointerMoveResize = (e: React.PointerEvent) => {\n        if (isResizing.current && windowRef.current) {\n            size.current = {\n                w: Math.max(240, e.clientX - dragOffset.current.x),\n                h: Math.max(200, e.clientY - dragOffset.current.y)\n            };\n            windowRef.current.style.width = `${size.current.w}px`;\n            windowRef.current.style.height = `${size.current.h}px`;\n        }\n    };\n\n    const handlePointerUpResize = (e: React.PointerEvent) => {\n        if (isResizing.current) {\n            isResizing.current = false;\n            (e.target as HTMLElement).releasePointerCapture(e.pointerId);\n        }\n    };\n\n    const toggleMaximize = () => {\n        setIsMaximized(!isMaximized);\n    };\n\n    const Icon = app.icon;\n    \n    const style: React.CSSProperties = isMaximized \n        ? {\n            top: 0, left: 0, width: '100%', height: 'calc(100% - var(--taskbar-height))',\n            zIndex: isActive ? 60 : 50,\n            borderRadius: 0,\n            boxShadow: 'none'\n        }\n        : {\n            top: `${pos.current.y}px`, left: `${pos.current.x}px`, \n            width: `${size.current.w}px`, height: `${size.current.h}px`,\n            zIndex: isActive ? 60 : 50,\n            borderRadius: 'var(--sys-radius)',\n            border: '1px solid var(--sys-border)',\n            boxShadow: isActive ? '0 12px 32px rgba(0,0,0,0.2)' : 'var(--sys-shadow)'\n        };\n\n    return (\n        <div \n            className={`window-container ${isActive ? 'active' : ''}`} \n            style={style}\n            onPointerDown={onFocus}\n            ref={windowRef}\n        >\n            <div \n                className=\"window-header\"\n                onPointerDown={handlePointerDownHeader}\n                onPointerMove={handlePointerMoveHeader}\n                onPointerUp={handlePointerUpHeader}\n                onPointerCancel={handlePointerUpHeader}\n                onDoubleClick={toggleMaximize}\n                style={{ cursor: isMaximized ? 'default' : 'move' }}\n            >\n                <div className=\"window-title\">\n                    <Icon size={16} />\n                    <span>{app.name}</span>\n                </div>\n                <div className=\"window-controls\" onPointerDown={e => e.stopPropagation()}>\n                    <div className=\"window-btn\"><Minus size={16} /></div>\n                    <div className=\"window-btn\" onClick={toggleMaximize}>\n                        {isMaximized ? <Minimize2 size={14} /> : <Square size={14} />}\n                    </div>\n                    <div className=\"window-btn close\" onClick={onClose}><X size={16} /></div>\n                </div>\n            </div>\n            <div className=\"window-content\">\n                <app.component onClose={onClose} />\n            </div>\n            {!isMaximized && (\n                <div \n                    className=\"window-resize-handle\"\n                    onPointerDown={handlePointerDownResize}\n                    onPointerMove={handlePointerMoveResize}\n                    onPointerUp={handlePointerUpResize}\n                    onPointerCancel={handlePointerUpResize}\n                />\n            )}\n        </div>\n    );\n};","App.tsx":"import React, { useState, useEffect } from 'react';\nimport { Calculator } from './components/apps/Calculator';\nimport { Notes } from './components/apps/Notes';\nimport { Settings } from './components/apps/Settings';\nimport { Terminal } from './components/apps/Terminal';\nimport { Window } from './components/Window';\nimport { checkGodMode } from './utils/godMode';\nimport { playClickSound, playStartupSound } from './utils/audio';\nimport { AppDefinition, OsState } from './types';\nimport { LayoutGrid, Calculator as CalcIcon, StickyNote, Settings as SettingsIcon, TerminalSquare, Wifi, BatteryMedium, Volume2 } from 'lucide-react';\n\nconst APPS: AppDefinition[] = [\n    { id: 'calc', name: 'Calculator', icon: CalcIcon, component: Calculator },\n    { id: 'notes', name: 'Notes', icon: StickyNote, component: Notes },\n    { id: 'settings', name: 'Settings', icon: SettingsIcon, component: Settings },\n    { id: 'terminal', name: 'Root Terminal', icon: TerminalSquare, component: Terminal, isGodModeOnly: true }\n];\n\nexport const App: React.FC = () => {\n    const [state, setState] = useState<OsState>({\n        activeAppId: null,\n        openAppIds: [],\n        isStartMenuOpen: false\n    });\n    const [time, setTime] = useState(new Date());\n    const [isGodMode, setIsGodMode] = useState(false);\n    const [hasStarted, setHasStarted] = useState(false);\n\n    useEffect(() => {\n        setIsGodMode(checkGodMode());\n        const timer = setInterval(() => setTime(new Date()), 1000);\n        \n        const handleGodModeChange = () => setIsGodMode(checkGodMode());\n        window.addEventListener('godModeChanged', handleGodModeChange);\n\n        return () => {\n            clearInterval(timer);\n            window.removeEventListener('godModeChanged', handleGodModeChange);\n        };\n    }, []);\n\n    useEffect(() => {\n        const handleFirstInteraction = () => {\n            if (!hasStarted) {\n                playStartupSound();\n                setHasStarted(true);\n            }\n            window.removeEventListener('click', handleFirstInteraction);\n        };\n        window.addEventListener('click', handleFirstInteraction);\n        return () => window.removeEventListener('click', handleFirstInteraction);\n    }, [hasStarted]);\n\n    const toggleStartMenu = () => {\n        playClickSound();\n        setState(s => ({ ...s, isStartMenuOpen: !s.isStartMenuOpen }));\n    };\n\n    const closeStartMenu = () => {\n        if (state.isStartMenuOpen) {\n            setState(s => ({ ...s, isStartMenuOpen: false }));\n        }\n    };\n\n    const openApp = (appId: string) => {\n        playClickSound();\n        setState(s => {\n            const isOpen = s.openAppIds.includes(appId);\n            return {\n                ...s,\n                isStartMenuOpen: false,\n                activeAppId: appId,\n                openAppIds: isOpen ? s.openAppIds : [...s.openAppIds, appId]\n            };\n        });\n    };\n\n    const closeApp = (appId: string) => {\n        playClickSound();\n        setState(s => ({\n            ...s,\n            activeAppId: s.activeAppId === appId ? null : s.activeAppId,\n            openAppIds: s.openAppIds.filter(id => id !== appId)\n        }));\n    };\n\n    const visibleApps = APPS.filter(a => !a.isGodModeOnly || isGodMode);\n\n    return (\n        <div className=\"os-container\" onClick={closeStartMenu}>\n            <div className=\"desktop\">\n                {visibleApps.map(app => {\n                    const Icon = app.icon;\n                    return (\n                        <div key={`desktop-${app.id}`} className=\"desktop-icon\" onDoubleClick={() => openApp(app.id)} onClick={(e) => { e.stopPropagation(); openApp(app.id); }}>\n                            <div className=\"icon-wrapper\">\n                                <Icon size={24} />\n                            </div>\n                            <span>{app.name}</span>\n                        </div>\n                    );\n                })}\n            </div>\n\n            {state.openAppIds.map(appId => {\n                const app = APPS.find(a => a.id === appId);\n                if (!app) return null;\n                return (\n                    <Window \n                        key={`window-${app.id}`}\n                        app={app} \n                        isActive={state.activeAppId === app.id}\n                        onFocus={() => {\n                            if (state.activeAppId !== app.id) {\n                                setState(s => ({ ...s, activeAppId: app.id }));\n                            }\n                        }}\n                        onClose={() => closeApp(app.id)} \n                    />\n                );\n            })}\n\n            <div className={`start-menu ${state.isStartMenuOpen ? 'open' : ''}`} onClick={e => e.stopPropagation()}>\n                <input type=\"text\" className=\"start-search\" placeholder=\"Type here to search\" />\n                <div style={{marginBottom: '16px', fontWeight: 600, fontSize: '14px', color: 'var(--sys-text)'}}>Pinned</div>\n                <div className=\"start-apps-grid\">\n                    {visibleApps.map(app => {\n                        const Icon = app.icon;\n                        return (\n                            <div key={`start-${app.id}`} className=\"start-app-item\" onClick={() => openApp(app.id)}>\n                                <Icon className=\"icon\" color={app.isGodModeOnly ? '#00ff00' : 'currentColor'} />\n                                <span>{app.name}</span>\n                            </div>\n                        );\n                    })}\n                </div>\n            </div>\n\n            <div className=\"taskbar\" onClick={e => e.stopPropagation()}>\n                <div className=\"taskbar-center\">\n                    <div className=\"start-button\" onClick={toggleStartMenu}>\n                        <LayoutGrid size={20} />\n                    </div>\n                    {state.openAppIds.map(appId => {\n                        const app = APPS.find(a => a.id === appId);\n                        if (!app) return null;\n                        const Icon = app.icon;\n                        const isActive = state.activeAppId === appId;\n                        return (\n                            <div \n                                key={`tb-${appId}`} \n                                className={`taskbar-icon ${isActive ? 'active' : ''}`}\n                                onClick={() => openApp(appId)}\n                            >\n                                <Icon size={18} color={app.isGodModeOnly ? '#00ff00' : 'currentColor'} />\n                            </div>\n                        );\n                    })}\n                </div>\n                <div className=\"taskbar-right\">\n                    {isGodMode && <span className=\"god-mode-indicator\">ROOTED</span>}\n                    <div className=\"sys-tray\">\n                        <Wifi size={14} />\n                        <Volume2 size={14} />\n                        <BatteryMedium size={14} />\n                    </div>\n                    <div className=\"sys-tray\" style={{flexDirection: 'column', gap: '2px', alignItems: 'flex-end'}}>\n                        <span className=\"text-xs font-bold\">{time.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>\n                        <span className=\"text-xs\">{time.toLocaleDateString()}</span>\n                    </div>\n                </div>\n            </div>\n        </div>\n    );\n};","index.tsx":"import React from 'react';\nimport { createRoot } from 'react-dom/client';\nimport { App } from './App'; \n\nconst container = document.getElementById('root');\nif (container) {\n    const root = createRoot(container);\n    root.render(<App />);\n}"};
    const moduleBlobUrls = {};

    function showError(msg) {
        console.error(msg);
        let container = document.getElementById('root') || document.getElementById('app') || document.body;
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'color: #b91c1c; background: #fef2f2; border: 1px solid #f87171; padding: 16px; border-radius: 8px; font-family: ui-monospace, monospace; font-size: 13px; margin: 16px; white-space: pre-wrap; line-height: 1.5; z-index: 999999; position: relative;';
        errDiv.innerHTML = '<strong>⚠️ Runtime Error</strong><br/><br/>' + String(msg).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        if (container) {
            container.prepend(errDiv);
        } else {
            document.body.prepend(errDiv);
        }
    }

    window.addEventListener('error', function(e) {
        showError((e.message || 'Script execution error') + (e.filename ? '\nAt ' + e.filename + ':' + e.lineno : ''));
    });

    window.addEventListener('unhandledrejection', function(e) {
        const reason = e.reason ? (e.reason.stack || e.reason.message || e.reason) : 'Promise rejected';
        showError('Unhandled rejection:\n' + reason);
    });

    // Helper: Normalize and resolve relative import path against source file
    function resolveRelativeModule(fromFile, importPath) {
        const cleanImport = importPath.trim();
        if (!cleanImport.startsWith('.')) return null;

        const parts = fromFile.split('/');
        parts.pop(); // discard source filename

        const segs = cleanImport.split('/');
        for (const s of segs) {
            if (s === '.' || s === '') continue;
            if (s === '..') {
                if (parts.length > 0) parts.pop();
            } else {
                parts.push(s);
            }
        }
        const basePath = parts.join('/');
        const exts = ['', '.tsx', '.ts', '.jsx', '.js', '.json', '.css', '.mjs'];

        for (const ext of exts) {
            const candidate = basePath + ext;
            if (files[candidate] !== undefined) return candidate;
            const stripped = candidate.replace(/^\.\//, '');
            if (files[stripped] !== undefined) return stripped;
        }

        // Try index files
        for (const ext of ['.tsx', '.ts', '.jsx', '.js']) {
            const candidate = basePath + '/index' + ext;
            if (files[candidate] !== undefined) return candidate;
            const stripped = candidate.replace(/^\.\//, '');
            if (files[stripped] !== undefined) return stripped;
        }

        return basePath;
    }

    // 1. Process non-code assets (JSON, CSS) into Blob URLs
    for (const [filename, content] of Object.entries(files)) {
        if (filename.endsWith('.json')) {
            let jsonVal = content;
            try {
                JSON.parse(content);
                jsonVal = content.trim();
            } catch(e) {
                jsonVal = JSON.stringify(content);
            }
            const esm = 'export default ' + jsonVal + ';\n';
            const blob = new Blob([esm], { type: 'application/javascript' });
            moduleBlobUrls[filename] = URL.createObjectURL(blob);
            moduleBlobUrls['./' + filename] = moduleBlobUrls[filename];
        } else if (filename.endsWith('.css')) {
            const cssCode = 'const css = ' + JSON.stringify(content) + ';\n' +
                'const style = document.createElement("style");\n' +
                'style.setAttribute("data-filename", ' + JSON.stringify(filename) + ');\n' +
                'style.textContent = css;\n' +
                'document.head.appendChild(style);\n' +
                'export default css;\n';
            const blob = new Blob([cssCode], { type: 'application/javascript' });
            moduleBlobUrls[filename] = URL.createObjectURL(blob);
            moduleBlobUrls['./' + filename] = moduleBlobUrls[filename];
        }
    }

    // 2. Transpile all code files with Babel Standalone
    const transpiledMap = {};
    const codeFilesList = Object.keys(files).filter(k => k.match(/\.(tsx?|jsx?|js|mjs)$/i));

    for (const filename of codeFilesList) {
        const content = files[filename];
        try {
            const result = Babel.transform(content, {
                filename: filename,
                presets: [
                    ['react', { runtime: 'automatic' }],
                    'typescript'
                ],
                sourceType: 'module'
            });
            transpiledMap[filename] = result.code;
        } catch (err) {
            showError('Babel compilation error in ' + filename + ':\n' + (err.message || err));
            return;
        }
    }

    // 3. Iterative / Multi-Pass resolution of relative imports into Blob URLs
    const pendingFiles = new Set(codeFilesList);
    let iterations = 0;
    const maxIterations = codeFilesList.length + 2;

    while (pendingFiles.size > 0 && iterations < maxIterations) {
        iterations++;
        let resolvedAny = false;

        for (const filename of Array.from(pendingFiles)) {
            let code = transpiledMap[filename];
            if (!code) {
                pendingFiles.delete(filename);
                continue;
            }

            // Find all local imports in this file
            const relImports = [];
            const importRegex = /(?:import|export)\s+(?:[\w*\s{},]*\s+from\s+)?['"](\.[^'"]+)['"]/g;
            let m;
            while ((m = importRegex.exec(code)) !== null) {
                relImports.push(m[1]);
            }
            const dynImportRegex = /import\s*\(\s*['"](\.[^'"]+)['"]\s*\)/g;
            while ((m = dynImportRegex.exec(code)) !== null) {
                relImports.push(m[1]);
            }

            // Check if all relative dependencies already have blob URLs (or if this is a fallback iteration)
            const allDepsReady = relImports.every(imp => {
                const target = resolveRelativeModule(filename, imp);
                return !target || !!moduleBlobUrls[target] || !files[target];
            });

            if (allDepsReady || iterations === maxIterations) {
                // Rewrite code replacing all local relative imports with their Blob URLs
                code = code.replace(/(import|export)\s+([\w*\s{},]*\s+from\s+)?['"](\.[^'"]+)['"]/g, (match, type, clause, importPath) => {
                    const target = resolveRelativeModule(filename, importPath);
                    const blobUrl = target ? moduleBlobUrls[target] : null;
                    if (blobUrl) {
                        return `${type} ${clause || ''} '${blobUrl}'`;
                    }
                    return match;
                });

                code = code.replace(/import\s*\(\s*['"](\.[^'"]+)['"]\s*\)/g, (match, importPath) => {
                    const target = resolveRelativeModule(filename, importPath);
                    const blobUrl = target ? moduleBlobUrls[target] : null;
                    if (blobUrl) {
                        return `import('${blobUrl}')`;
                    }
                    return match;
                });

                const blob = new Blob([code], { type: 'application/javascript' });
                const blobUrl = URL.createObjectURL(blob);
                moduleBlobUrls[filename] = blobUrl;
                moduleBlobUrls['./' + filename] = blobUrl;
                const noExt = filename.replace(/\.[a-zA-Z0-9]+$/, '');
                moduleBlobUrls[noExt] = blobUrl;
                moduleBlobUrls['./' + noExt] = blobUrl;

                pendingFiles.delete(filename);
                resolvedAny = true;
            }
        }

        if (!resolvedAny && pendingFiles.size > 0) {
            // Force create blob URLs for the first pending file in circular cases
            const nextFile = Array.from(pendingFiles)[0];
            let code = transpiledMap[nextFile];
            code = code.replace(/(import|export)\s+([\w*\s{},]*\s+from\s+)?['"](\.[^'"]+)['"]/g, (match, type, clause, importPath) => {
                const target = resolveRelativeModule(nextFile, importPath);
                const blobUrl = target ? moduleBlobUrls[target] : null;
                return blobUrl ? `${type} ${clause || ''} '${blobUrl}'` : match;
            });
            const blob = new Blob([code], { type: 'application/javascript' });
            const blobUrl = URL.createObjectURL(blob);
            moduleBlobUrls[nextFile] = blobUrl;
            moduleBlobUrls['./' + nextFile] = blobUrl;
            pendingFiles.delete(nextFile);
        }
    }

    // 4. Find and execute Entry Point
    const candidates = [
        'index.tsx', 'src/index.tsx', 'main.tsx', 'src/main.tsx',
        'index.jsx', 'src/index.jsx', 'main.jsx', 'src/main.jsx',
        'App.tsx', 'src/App.tsx', 'App.jsx', 'src/App.jsx',
        'main.js', 'src/main.js', 'index.js', 'src/index.js'
    ];

    let entryFile = null;
    for (const c of candidates) {
        if (files[c] && moduleBlobUrls[c]) {
            entryFile = c;
            break;
        }
    }

    if (!entryFile) {
        const anyModule = Object.keys(files).find(k => moduleBlobUrls[k] && k.match(/\.(tsx?|jsx?)$/i));
        if (anyModule) entryFile = anyModule;
    }

    if (entryFile && moduleBlobUrls[entryFile]) {
        try {
            const entryMod = await import(moduleBlobUrls[entryFile]);

            // If the entry module exports a React Component (e.g. App.tsx) and hasn't mounted itself:
            const Component = entryMod.default || entryMod.App || (typeof entryMod === 'function' ? entryMod : null);
            if (Component && typeof Component === 'function') {
                const rootContainer = document.getElementById('root') || document.getElementById('app') || document.body;
                if (rootContainer && !rootContainer.children.length) {
                    try {
                        const React = await import('react');
                        const ReactDOM = await import('react-dom/client');
                        const root = ReactDOM.createRoot(rootContainer);
                        root.render(React.createElement(Component));
                    } catch (mountErr) {
                        console.warn('Auto-mount warning:', mountErr);
                    }
                }
            }
        } catch (execErr) {
            showError('Execution Error:\n' + (execErr.stack || execErr.message || execErr));
        }
    } else {
        console.warn('No executable React/TSX entry file found in project:', Object.keys(files));
    }
})();
