<!--
APP_NAME: FlashBrief
APP_DESCRIPTION: Critical intelligence and performance reports terminal.
APP_ICON: 
APP_CATEGORY: Utilities
WINDOW_WIDTH: 380
WINDOW_HEIGHT: 480
VERSION_SUMMARY: Initial release with terminal UI and interactive reports.
STORE_ID: flashbrief-v1
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Brief Terminal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --bg-base: #080808;
            --bg-pattern-1: #111111;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent-grad: linear-gradient(135deg, #f02b70, #df1b4a);
            --bar-track: #222222;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            --transition-speed: 0.4s;
        }

        /* God Mode overrides */
        body.god-mode {
            --accent-grad: linear-gradient(135deg, #00ff88, #00aa55);
            --text-muted: #66aa88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-sans);
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--text-main);
            /* Handle OS standard light mode by containing the dark app */
            background: rgba(255, 255, 255, 0.05); 
        }

        /* Main App Container simulating the card in the image */
        #app-container {
            width: 100%;
            height: 100%;
            max-width: 400px;
            background-color: var(--bg-base);
            /* Diamond pattern from image */
            background-image: 
                linear-gradient(45deg, var(--bg-pattern-1) 25%, transparent 25%, transparent 75%, var(--bg-pattern-1) 75%, var(--bg-pattern-1)),
                linear-gradient(45deg, var(--bg-pattern-1) 25%, transparent 25%, transparent 75%, var(--bg-pattern-1) 75%, var(--bg-pattern-1));
            background-size: 16px 16px;
            background-position: 0 0, 8px 8px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Subtle scanlines for terminal vibe */
        .scanlines {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.15) 50%, rgba(0,0,0,0.15));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
        }

        .content-wrapper {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            transition: opacity var(--transition-speed) ease;
        }

        /* Header Area */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: var(--accent-grad);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(240, 43, 112, 0.3);
            transition: background var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
        }

        body.god-mode .icon-box {
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .icon-box svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #fff;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .meta-info {
            text-align: right;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1px;
            line-height: 1.6;
            text-transform: uppercase;
        }

        /* Title Area */
        .verdict {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .title {
            font-size: 26px;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 36px;
            letter-spacing: -0.5px;
            min-height: 64px; /* prevent layout shift */
        }

        /* Metrics List */
        .metrics-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
        }

        .metric-item {
            display: flex;
            align-items: center;
            opacity: 0;
            transform: translateX(-10px);
            animation: slideIn 0.4s ease forwards;
        }

        /* Stagger animations */
        .metric-item:nth-child(1) { animation-delay: 0.1s; }
        .metric-item:nth-child(2) { animation-delay: 0.2s; }
        .metric-item:nth-child(3) { animation-delay: 0.3s; }
        .metric-item:nth-child(4) { animation-delay: 0.4s; }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        .metric-num {
            width: 28px;
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
        }

        .metric-label {
            flex: 1;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 12px;
        }

        .metric-bar-container {
            width: 60px;
            height: 4px;
            background: var(--bar-track);
            border-radius: 2px;
            margin-right: 16px;
            overflow: hidden;
            position: relative;
        }

        .metric-bar-fill {
            height: 100%;
            background: var(--accent-grad);
            width: 0%;
            border-radius: 2px;
            transition: width 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.3s;
        }

        .metric-value {
            width: 85px;
            text-align: right;
            font-family: var(--font-mono);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            justify-content: flex-end;
            align-items: baseline;
            gap: 4px;
        }

        .metric-unit {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-muted);
        }

        /* Footer */
        .footer {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 24px;
            border-top: 1px solid rgba(255,255,255,0.05);
            position: relative;
            z-index: 2;
        }

        .progress-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--text-muted);
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .dot.active {
            opacity: 1;
            background: #fff;
        }

        .god-mode-indicator {
            display: none;
            margin-left: auto;
            font-family: var(--font-mono);
            font-size: 9px;
            color: #00ff88;
            letter-spacing: 1px;
            animation: pulse 2s infinite;
        }

        body.god-mode .god-mode-indicator {
            display: block;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Navigation Overlays */
        .nav-zone {
            position: absolute;
            top: 0;
            bottom: 40px;
            width: 40%;
            z-index: 100;
            cursor: pointer;
        }
        .nav-zone.left { left: 0; }
        .nav-zone.right { right: 0; }

        /* Mobile specific adjustments */
        body.mobile-mode #app-container {
            border-radius: 0; /* Often better to fill screen on mobile */
            max-width: 100%;
        }
        body.mobile-mode .content-wrapper {
            padding: 16px;
        }
        body.mobile-mode .title {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="scanlines"></div>
        
        <div class="nav-zone left" onclick="prevBrief()"></div>
        <div class="nav-zone right" onclick="nextBrief()"></div>

        <div class="content-wrapper" id="content-area">
            <div class="header">
                <div class="icon-box" id="ui-icon">
                    <!-- Default Moon Icon -->
                    <svg viewBox="0 0 24 24" id="ui-icon-svg">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </div>
                <div class="meta-info">
                    <div id="ui-date">Q4 2025 · VOL. 1</div>
                    <div id="ui-type">FLASH BRIEF</div>
                </div>
            </div>

            <div class="verdict" id="ui-verdict">VERDICT · CRITICAL</div>
            <h1 class="title" id="ui-title">Gemini 3.6 Flash: a strategic failure</h1>

            <div class="metrics-list" id="ui-metrics">
                <!-- Injected via JS -->
            </div>
        </div>

        <div class="footer">
            <div class="progress-dots" id="ui-dots">
                <!-- Injected via JS -->
            </div>
            <div class="god-mode-indicator">GOD MODE // ACTIVE</div>
        </div>
    </div>

    <script>
        // --- System Checks ---
        const debugOptions = JSON.parse(localStorage.getItem('gemini96-debugOptions') || '{}');
        const isGodMode = debugOptions.flappyGodMode === true; // Generic god mode check flag

        if (isGodMode) {
            document.body.classList.add('god-mode');
        }

        // --- Data ---
        const reports = [
            {
                date: "Q4 2025 · VOL. 1",
                type: "FLASH BRIEF",
                verdict: "VERDICT · CRITICAL",
                title: "Gemini 3.6 Flash: a strategic failure",
                icon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>',
                metrics: [
                    { num: "01", label: "Latency", value: "38", unit: "ms/tok", percent: 55 },
                    { num: "02", label: "Cost", value: "$0.18", unit: "", percent: 55 },
                    { num: "03", label: "AIME", value: "38.7", unit: "", percent: 20 }
                ]
            },
            {
                date: "Q1 2026 · VOL. 2",
                type: "SYSTEM REPORT",
                verdict: "STATUS · OPTIMAL",
                title: "Quantum Core Integration Successful",
                icon: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>',
                metrics: [
                    { num: "01", label: "Stability", value: "99.9", unit: "%", percent: 95 },
                    { num: "02", label: "Throughput", value: "1.2", unit: "PB/s", percent: 80 },
                    { num: "03", label: "Thermal", value: "42", unit: "°C", percent: 30 }
                ]
            },
            {
                date: "Q2 2026 · VOL. 3",
                type: "MARKET INTEL",
                verdict: "THREAT · ELEVATED",
                title: "Competitor 'Nova' gaining market share",
                icon: '<path d="M2 20h.01M7 20v-4M12 20v-8M17 20V8M22 4v16"></path>',
                metrics: [
                    { num: "01", label: "Growth", value: "+14", unit: "%", percent: 70 },
                    { num: "02", label: "Sentiment", value: "6.8", unit: "/10", percent: 68 },
                    { num: "03", label: "Win Rate", value: "45", unit: "%", percent: 45 }
                ]
            }
        ];

        if (isGodMode) {
            reports.push({
                date: "CLASSIFIED",
                type: "OVERRIDE",
                verdict: "ACCESS GRANTED",
                title: "PROJECT TITAN: Omni-consciousness Achieved",
                icon: '<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>',
                metrics: [
                    { num: "01", label: "Intelligence", value: "MAX", unit: "", percent: 100 },
                    { num: "02", label: "Control", value: "ABSOLUTE", unit: "", percent: 100 },
                    { num: "03", label: "Limiters", value: "0", unit: "%", percent: 0 },
                    { num: "04", label: "Power", value: "999", unit: "TW", percent: 100 }
                ]
            });
        }

        let currentIndex = 0;
        let autoPlayTimer = null;

        // --- Audio System ---
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'blip') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isGodMode ? 1200 : 800, now);
                osc.frequency.exponentialRampToValueAtTime(isGodMode ? 2000 : 1200, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'glitch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        // --- UI Logic ---
        function renderBrief(index) {
            const report = reports[index];
            const contentArea = document.getElementById('content-area');
            
            // Fade out
            contentArea.style.opacity = 0;
            
            setTimeout(() => {
                document.getElementById('ui-date').textContent = report.date;
                document.getElementById('ui-type').textContent = report.type;
                document.getElementById('ui-verdict').textContent = report.verdict;
                document.getElementById('ui-title').textContent = report.title;
                document.getElementById('ui-icon-svg').innerHTML = report.icon;

                const metricsContainer = document.getElementById('ui-metrics');
                metricsContainer.innerHTML = '';

                report.metrics.forEach((m, i) => {
                    const el = document.createElement('div');
                    el.className = 'metric-item';
                    // Need a slight delay to re-trigger CSS animations
                    el.style.animationDelay = `${0.1 * i}s`;
                    
                    // The label truncation uses 'Laten...' style
                    const labelStr = m.label;
                    
                    el.innerHTML = `
                        <div class="metric-num">${m.num}</div>
                        <div class="metric-label" title="${labelStr}">${labelStr}</div>
                        <div class="metric-bar-container">
                            <div class="metric-bar-fill" id="bar-${i}"></div>
                        </div>
                        <div class="metric-value">
                            ${m.value}
                            ${m.unit ? `<span class="metric-unit">${m.unit}</span>` : ''}
                        </div>
                    `;
                    metricsContainer.appendChild(el);

                    // Animate bar fill after a tiny delay
                    setTimeout(() => {
                        const bar = document.getElementById(`bar-${i}`);
                        if(bar) bar.style.width = `${m.percent}%`;
                    }, 50 + (i * 100));
                });

                updateDots(index);
                
                // Fade in
                contentArea.style.opacity = 1;
                playSound('blip');
            }, 300); // Matches CSS transition speed roughly
        }

        function createDots() {
            const dotsContainer = document.getElementById('ui-dots');
            dotsContainer.innerHTML = '';
            reports.forEach((_, i) => {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.onclick = (e) => {
                    e.stopPropagation(); // prevent triggering nav zones
                    initAudio();
                    currentIndex = i;
                    renderBrief(currentIndex);
                    resetAutoPlay();
                };
                dotsContainer.appendChild(dot);
            });
        }

        function updateDots(index) {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                if(i === index) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        function nextBrief() {
            initAudio();
            currentIndex = (currentIndex + 1) % reports.length;
            if(isGodMode && currentIndex === reports.length -1) playSound('glitch');
            renderBrief(currentIndex);
            resetAutoPlay();
        }

        function prevBrief() {
            initAudio();
            currentIndex = (currentIndex - 1 + reports.length) % reports.length;
            renderBrief(currentIndex);
            resetAutoPlay();
        }

        function startAutoPlay() {
            autoPlayTimer = setInterval(nextBrief, 5000);
        }

        function resetAutoPlay() {
            clearInterval(autoPlayTimer);
            startAutoPlay();
        }

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            createDots();
            renderBrief(currentIndex);
            startAutoPlay();
            
            // First interaction enables audio context
            document.body.addEventListener('click', initAudio, { once: true });
        });

    </script>
</body>
</html>
